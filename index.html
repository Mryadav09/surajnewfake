<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Prediction Tool</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Poppins:wght@600;700;900&family=Montserrat:wght@800;900&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent;
        } 
        body, html { 
            overflow: hidden; 
            width: 100vw; height: 100vh; 
            font-family: 'Poppins', sans-serif;
            background: #000;
        }
        
        /* Animations */
        @keyframes textPulse { 0% { opacity: 0.7; } 50% { opacity: 1; } 100% { opacity: 0.7; } }
        @keyframes scanMove { 0% { top: -2px; } 100% { top: 100%; } }
        @keyframes moveLR { 0% { left: -20%; } 100% { left: 120%; } } 
        @keyframes moveRL { 0% { right: -20%; } 100% { right: 120%; } }
        @keyframes rgbBorder { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        
        /* Login Screen */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #1a0033 0%, #000000 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 99999;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.05); padding: 30px; border-radius: 15px;
            border: 1px solid rgba(0, 255, 255, 0.2); text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1); backdrop-filter: blur(10px);
        }
        .login-box h2 {
            color: #00ffff; font-family: 'Righteous', cursive; margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5); font-size: 24px; letter-spacing: 2px;
        }
        .login-box input {
            width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px;
            border: 1px solid #ff007f; background: rgba(0,0,0,0.5); color: #fff;
            font-family: 'Poppins', sans-serif; font-weight: 700; text-align: center; outline: none;
        }
        .login-box button {
            width: 100%; padding: 12px; border-radius: 8px; background: linear-gradient(45deg, #ff007f, #7f00ff);
            color: #fff; font-family: 'Poppins', sans-serif; font-weight: 900; border: none; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px; box-shadow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        /* Background Webview (iframe) */
        #bg-webview {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; z-index: 1;
        }

        /* Main App Container (Hidden before login) */
        #app-container { display: none; }

        /* Floating Mini Icon */
        #mini-icon { 
            width: 60px; height: 60px; border-radius: 50%; background: transparent; 
            display: flex; align-items: center; justify-content: center; cursor: pointer; 
            position: absolute; top: 20px; left: 20px; z-index: 1000; box-sizing: border-box; padding: 3px; 
            touch-action: none; /* Prevents scroll when dragging */
        } 
        #mini-icon::before { 
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; 
            background: linear-gradient(45deg, #ff007f, #00ffff); z-index: -1; border-radius: 50%; animation: rgbBorder 3s infinite; background-size: 200% 200%;
        } 
        #inner-mini { 
            width: 100%; height: 100%; background: #000; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        #inner-mini img {
            width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
        }

        /* Independent Panel Styling */
        .panel {
            width: 210px; height: 240px; background-color: transparent; border-radius: 16px; 
            display: none; flex-direction: column; position: absolute; padding: 3px;
            z-index: 100; touch-action: none; cursor: grab;
        }
        .panel:active { cursor: grabbing; }
        .panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; z-index: -1;
            background: linear-gradient(45deg, #ff007f, #7f00ff, #00f2fe, #00ff87);
            background-size: 300% 300%; animation: rgbBorder 4s ease infinite; border-radius: 16px;
        }
        .inner-panel {
            background: #000000; width: 100%; height: 100%; border-radius: 13px; 
            display: flex; flex-direction: column; justify-content: space-between; position: relative; overflow: hidden;
        }

        /* Default starting positions for tools */
        #tool1 { top: 15%; left: 50%; transform: translateX(-50%); }
        #tool2 { top: 55%; left: 50%; transform: translateX(-50%); }

        /* Internal UI Elements */
        .header { background: rgba(20, 20, 25, 0.8); backdrop-filter: blur(12px); padding: 8px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); position: relative; z-index: 1; pointer-events: none; }
        .title-plain { font-family: 'Righteous', cursive; font-size: 12px; font-weight: 900; background: linear-gradient(to right, #00f2fe, #f093fb); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: textPulse 2s ease infinite; letter-spacing: 0.5px; }
        
        .info-box { background: rgba(30, 30, 40, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 10px; margin: 5px 8px; padding: 12px; text-align: center; display: flex; flex-direction: column; justify-content: center; pointer-events: none; }
        
        .result-box { width: 88%; margin: 7px auto 10px auto; min-height: 95px; background: rgba(15, 15, 20, 0.9); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 10px; position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
        
        /* Matrix Animation Styling */
        .matrix-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; font-family: 'Orbitron', monospace; font-size: 9px; color: rgba(0, 242, 254, 0.5); word-break: break-all; text-align: left; line-height: 1.0; z-index: 1; overflow: hidden; }
        .matrix-scanner { position: absolute; top: 0; left: 0; width: 100%; height: 2px; background: #00ffff; box-shadow: 0 0 12px 3px #00ffff; animation: scanMove 1.2s linear infinite; z-index: 4; }
        .h-line { position: absolute; height: 1.5px; background: #f093fb; box-shadow: 0 0 6px 2px #f093fb; z-index: 3; }
        .h-line-1 { top: 25%; width: 45px; animation: moveLR 1.2s linear infinite; } 
        .h-line-2 { top: 50%; width: 60px; animation: moveRL 1.8s linear infinite; } 
        .h-line-3 { top: 75%; width: 35px; animation: moveLR 1.5s linear infinite; }
        
        .result-single-line { display: flex; align-items: center; justify-content: center; z-index: 2; }
        .result-text-premium { font-family: 'Montserrat', sans-serif; font-size: 38px; font-weight: 900; background: linear-gradient(45deg, #00ff87, #60efff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-shadow: 0 0 10px rgba(96, 239, 255, 0.3); }
        .period-text { font-family: 'Poppins', monospace; font-size: 11px; font-weight: 700; color: #a0a0b0; text-align: center; display: block; margin-top: 6px; z-index: 2; letter-spacing: 1px; }
        
        .buttons-area { display: flex; gap: 8px; padding: 4px 10px 10px; justify-content: center; z-index: 1; }
        .action-btn { flex: 1; padding: 10px 0; border-radius: 6px; font-family: 'Poppins', sans-serif; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; background: rgba(255, 255, 255, 0.08); color: #ffffff; border: 1px solid rgba(255, 255, 255, 0.15); transition: all 0.2s ease; z-index: 5; }
        .action-btn:active { transform: scale(0.95); background: rgba(255, 255, 255, 0.15); border-color: #00f2fe; }
    </style>
</head>
<body>

    <!-- SECURITY LOGIN SCREEN -->
    <div id="login-screen">
        <div class="login-box">
            <h2>ACCESS REQUIRED</h2>
            <input type="password" id="passInput" placeholder="Enter Password">
            <button onclick="checkPassword()">LOGIN</button>
        </div>
    </div>

    <!-- MAIN APP LAYER -->
    <div id="app-container">
        
        <!-- 100% Fit Background Website -->
        <iframe id="bg-webview" src="Https://dhaniwin.club9.us.cc/login"></iframe>

        <!-- Floating Mini Icon -->
        <div id="mini-icon" onclick="openTool()">
            <div id="inner-mini">
                <!-- Replace 'logo.png' with your actual image URL or local file name -->
                <img src="logo.png" alt="Logo">
            </div>
        </div>

        <!-- TOOL 1: BIG/SMALL PREDICTION (Independent) -->
        <div class="panel" id="tool1">
            <div class="inner-panel">
                <div class="header">
                    <div class="title-plain" id="hackTitle1">𝐀𝐃𝐌𝐈𝐍 𝐏𝐀𝐍𝐄𝐋</div>
                </div>
                <div id="content1" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
                    <!-- Initial State UI -->
                    <div class="info-box">
                        <div style="font-family:'Righteous', cursive; font-size:15px; background: linear-gradient(45deg, #00ff87, #60efff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom:8px;">SERVER CONNECTED</div>
                        <div style="font-size:9px; font-weight:700; color:#888899; text-align:center;">TAP START TO PREDICT</div>
                    </div>
                    <div class="buttons-area">
                        <button class="action-btn" style="border-color:rgba(0,255,135,0.4);" onclick="startHack()">START HACK</button>
                        <button class="action-btn" onclick="closeTool()">HIDE</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- TOOL 2: NUMBER PREDICTION (Independent) -->
        <div class="panel" id="tool2">
            <div class="inner-panel">
                <div class="header">
                    <div class="title-plain" id="hackTitle2">NUMBER PREDICTION</div>
                </div>
                <div id="content2" style="flex:1; display:flex; flex-direction:column; justify-content:center;">
                    <!-- Renders dynamically via JS -->
                </div>
            </div>
        </div>

    </div>

    <!-- JavaScript Logic -->
    <script>
        // ---------------- PASSWORD LOGIC ----------------
        function checkPassword() {
            var pass = document.getElementById("passInput").value;
            if (pass === "SURAJ") {
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("app-container").style.display = "block";
            } else {
                alert("Incorrect Password! Access Denied.");
            }
        }

        // ---------------- GLOBAL VARIABLES ----------------
        let isScanning = false;
        let isHackStarted = false; // Tracks if both tools should be opened together
        let matrixInt = null;
        let currentPeriodText = '';
        let currentResultSz = 'BIG';
        let currentNum = '0';
        let topZIndex = 100; 

        // Elements
        const miniIcon = document.getElementById('mini-icon');
        const tool1 = document.getElementById('tool1');
        const tool2 = document.getElementById('tool2');
        const content1 = document.getElementById('content1');
        const content2 = document.getElementById('content2');
        const title1 = document.getElementById('hackTitle1');

        // Apply Dragging to Independent Elements
        dragElement(tool1);
        dragElement(tool2);
        dragElement(miniIcon);

        // ---------------- TOOL VISIBILITY LOGIC ----------------
        function openTool() {
            miniIcon.style.display = 'none';
            tool1.style.display = 'flex';
            
            // If hack was started previously, open Tool 2 as well
            if (isHackStarted) {
                tool2.style.display = 'flex';
            }
        }

        function closeTool() {
            tool1.style.display = 'none';
            tool2.style.display = 'none';
            miniIcon.style.display = 'flex';
        }

        // ---------------- ANIMATION & API LOGIC ----------------
        function runMatrix() {
            if (matrixInt) clearInterval(matrixInt);
            const chars = '011001A9B8C7D6X01@#$%&';
            matrixInt = setInterval(() => {
                const els = document.querySelectorAll('.matrix-bg');
                els.forEach(el => {
                    let s = '';
                    for (let i = 0; i < 300; i++) s += chars.charAt(Math.floor(Math.random() * chars.length));
                    el.innerText = s;
                });
            }, 50);
        }

        const scanningHTML = `
            <div class="result-box">
                <div class="matrix-bg"></div>
                <div class="matrix-scanner"></div>
                <div class="h-line h-line-1"></div>
                <div class="h-line h-line-2"></div>
                <div class="h-line h-line-3"></div>
            </div>
            <div class="buttons-area">
                <button class="action-btn" onclick="closeTool()">HIDE</button>
            </div>
        `;

        function getResultHTML(resultText, type) {
            return `
                <div class="result-box">
                    <div class="result-single-line">
                        <span class="result-text-premium">${resultText}</span>
                    </div>
                    <span class="period-text">ID : ${currentPeriodText}</span>
                </div>
                <div class="buttons-area">
                    <button class="action-btn" onclick="changeResult()">CHANGE</button>
                    <button class="action-btn" onclick="closeTool()">HIDE</button>
                </div>
            `;
        }

        function startHack() {
            if (isScanning) return;
            isScanning = true;
            isHackStarted = true; // Set to true so both open on next logo click
            
            tool2.style.display = 'flex'; 
            title1.innerText = 'BIG/SMALL PREDICTION';
            
            content1.innerHTML = scanningHTML;
            content2.innerHTML = scanningHTML;
            runMatrix();
            fetchData();
        }

        function changeResult() {
            if (isScanning) return;
            isScanning = true;

            content1.innerHTML = scanningHTML;
            content2.innerHTML = scanningHTML;
            runMatrix();
            fetchData();
        }

        function fetchData() {
            fetch('https://draw.ar-lottery01.com/WinGo/WinGo_1M/GetHistoryIssuePage.json')
            .then(r => r.json())
            .then(data => {
                let last = data.data.list[0];
                let n = parseInt(last.number);
                
                currentResultSz = (n <= 4) ? 'SMALL' : 'BIG';
                currentNum = n;
                // FINAL 5 DIGITS
                currentPeriodText = String(last.issueNumber).slice(-5);

                setTimeout(() => {
                    clearInterval(matrixInt);
                    isScanning = false;
                    renderResults();
                }, 3000);
            })
            .catch(e => {
                setTimeout(() => {
                    clearInterval(matrixInt);
                    isScanning = false;
                    renderResults();
                }, 3000);
            });
        }

        function renderResults() {
            content1.innerHTML = getResultHTML(currentResultSz, 1);
            content2.innerHTML = getResultHTML(currentNum, 2);
        }

        // ---------------- SMOOTH INDEPENDENT DRAG LOGIC ----------------
        function dragElement(elmnt) {
            var pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            
            // Bring to front on touch/click
            elmnt.addEventListener('mousedown', bringToFront, {passive: false});
            elmnt.addEventListener('touchstart', bringToFront, {passive: false});

            elmnt.onmousedown = dragMouseDown;
            elmnt.ontouchstart = dragTouchStart;

            function bringToFront() {
                topZIndex++;
                elmnt.style.zIndex = topZIndex;
            }

            function dragMouseDown(e) {
                if(e.target.tagName.toLowerCase() === 'button') return;
                e = e || window.event;
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
            }

            function dragTouchStart(e) {
                if(e.target.tagName.toLowerCase() === 'button') return;
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                document.ontouchend = closeDragElement;
                document.ontouchmove = elementDragTouch;
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault(); 
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                updatePosition();
            }

            function elementDragTouch(e) {
                e.preventDefault(); // PREVENTS BACKGROUND SCROLLING
                pos1 = pos3 - e.touches[0].clientX;
                pos2 = pos4 - e.touches[0].clientY;
                pos3 = e.touches[0].clientX;
                pos4 = e.touches[0].clientY;
                updatePosition();
            }

            function updatePosition() {
                elmnt.style.transform = "none";
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;
            }
        }
    </script>
</body>
</html>
